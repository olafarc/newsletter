name: Sincronizar estado de Steam

on:
  schedule:
    # Cada 30 minutos. GitHub no garantiza el minuto exacto, puede demorar un poco.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar data/steam.json
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/steam-sync.mjs

      - name: Commit si hay cambios
        run: |
          git config user.name "steam-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/steam.json
          git diff --cached --quiet || git commit -m "Actualizar estado de Steam"
          git push
