<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;900&family=Bebas+Neue&display=swap');

  :root{
    --ink:#111111;
    --paper:#f7f6f2;
    --blue:#abd615;
    --blue-dim: rgba(171,214,21,0.14);
    --rule:#111111;
    --gray-photo:#5a5a5a;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:#d8d8d2;
    color:var(--ink);
    font-family:'Archivo', Helvetica, Arial, sans-serif;
  }

  .sheet{
    max-width:1200px;
    margin:24px auto;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
  }

  /* ===== MASTHEAD ===== */
  .masthead{
    padding:22px 36px 14px;
    border-bottom:4px solid var(--ink);
  }
  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-size:10.5px;
    line-height:1.5;
    letter-spacing:.02em;
    padding-bottom:14px;
  }
  .masthead-top .col{max-width:260px;}
  .masthead-top .col.right{text-align:right;}
  .masthead-top strong{font-weight:700;}

  .right-group{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .masthead-title{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding-top:10px;
  }
  .masthead-title .kicker{
    font-family:'Bebas Neue', Impact, sans-serif;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--blue);
    white-space:nowrap;
  }
  .masthead-title h1{
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:clamp(38px, 7vw, 84px);
    line-height:.9;
    margin:0;
    letter-spacing:-0.01em;
    flex:1;
  }
  .masthead-title h1 span.accent{color:var(--blue);}

  .masthead-bottom{
    display:flex;
    justify-content:space-between;
    padding-top:12px;
    font-size:10.5px;
    letter-spacing:.03em;
  }
  .masthead-bottom .tag{font-weight:700;}

  /* ===== now playing widget ===== */
  .now-playing-slot{
    display:flex;
    gap:12px;
    align-items:center;
    max-width:280px;
    text-align:left;
  }
  .now-playing-slot:empty{display:none;}
  .now-playing-slot .np-cover{
    width:72px;
    height:72px;
    flex-shrink:0;
    object-fit:cover;
    border:1px solid var(--ink);
    filter:grayscale(1) contrast(1.05);
    transition:filter .4s ease;
    cursor:pointer;
  }
  .now-playing-slot .np-cover:hover,
  .now-playing-slot .np-cover:active{
    filter:grayscale(0) contrast(1.05);
  }

  .now-playing-slot .steam-cover{
    width:120px;
    aspect-ratio:460/215;
    height:auto;
    flex-shrink:0;
    object-fit:cover;
    border:1px solid var(--ink);
    filter:grayscale(1) contrast(1.05);
    transition:filter .4s ease;
    cursor:pointer;
  }
  .now-playing-slot .steam-cover:hover,
  .now-playing-slot .steam-cover:active{
    filter:grayscale(0) contrast(1.05);
  }

  .now-playing-slot.steam-slot{
    flex-direction:row;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:none;
  }
  .now-playing-slot.steam-slot .steam-info{flex:1;min-width:0;}
  .steam-title-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    width:100%;
  }
  .steam-title-row .np-title{
    flex:1;
    min-width:0;
    overflow-wrap:break-word;
  }
  .steam-hours{
    font-size:9.5px;
    font-weight:700;
    color:#555;
    white-space:nowrap;
    flex-shrink:0;
  }
  .now-playing-slot .np-info{font-size:11px;line-height:1.5;}
  .now-playing-slot .np-label{
    display:block;
    color:var(--blue);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:9.5px;
    margin-bottom:3px;
  }
  .now-playing-slot .np-title{display:block;font-weight:700;}
  .now-playing-slot .np-meta{display:block;color:#555;}
  .now-playing-slot .np-comment{display:block;color:#777;font-style:italic;margin-top:2px;}

  .now-playing-wrap{position:relative;}

  .np-history{position:relative;margin-top:6px;text-align:right;}

  .status-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #ccc;
    flex-wrap:wrap;
  }
  .status-slot{flex:1;min-width:200px;}
  .status-slot:empty{display:none;min-width:0;}
  .status-row:not(:has(.status-slot:not(:empty))){display:none;}

  /* refleja el widget de música: portada a la derecha, para hacer de espejo con Steam (portada a la izquierda) */
  .status-row .now-playing-wrap .now-playing-slot{
    flex-direction:row-reverse;
    justify-content:flex-end;
    text-align:right;
  }
  .np-more{
    display:inline-block;
    font-size:9px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--blue);
    cursor:pointer;
    background:rgba(247,246,242,0.65);
    padding:2px 6px;
    border-radius:2px;
  }
  .np-dropdown{
    position:absolute;
    top:100%;
    right:0;
    margin-top:6px;
    background:var(--paper);
    border:1.5px solid var(--ink);
    box-shadow:0 8px 24px rgba(0,0,0,.22);
    width:250px;
    max-width:85vw;
    max-height:300px;
    overflow-y:auto;
    padding:8px;
    display:none;
    z-index:40;
    text-align:left;
  }
  .np-history:hover .np-dropdown,
  .np-history.open .np-dropdown{display:block;}

  .np-dropdown-title{
    font-size:8.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#888;
    margin-bottom:6px;
    padding-bottom:6px;
    border-bottom:1px solid #ccc;
  }
  .np-dropdown-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #e2e2e2;}
  .np-dropdown-item:last-child{border-bottom:none;}
  .np-dropdown-item img{
    width:32px;height:32px;flex-shrink:0;object-fit:cover;
    border:1px solid var(--ink);
    filter:grayscale(1) contrast(1.05);
  }
  .np-dropdown-item img.steam-dd-cover{
    width:56px;
    height:auto;
    aspect-ratio:460/215;
  }
  .np-dropdown-item .dd-info{font-size:9.5px;line-height:1.4;}
  .np-dropdown-item .dd-title{display:block;font-weight:700;}
  .np-dropdown-item .dd-meta{display:block;color:#777;}

  /* ===== leer más / modal de nota completa ===== */
  .read-more-dots{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:8px;
    background:rgba(247,246,242,0.75);
    border:none;
    color:var(--blue);
    cursor:pointer;
    padding:5px 9px;
    border-radius:2px;
    font-family:'Archivo', Arial, sans-serif;
    font-size:10.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    transition:opacity .2s ease;
  }
  .read-more-dots .rm-dots{
    font-size:17px;
    letter-spacing:3px;
    line-height:1;
  }
  .read-more-dots:hover{opacity:.65;}

  .photo.color-always{filter:grayscale(0) contrast(1.05) !important;}

  .entry-modal{
    position:fixed;
    inset:0;
    display:none;
    z-index:200;
    align-items:flex-start;
    justify-content:center;
    padding:5vh 20px;
    overflow-y:auto;
  }
  .entry-modal.open{display:flex;}
  .entry-modal-backdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:0;
  }
  .entry-modal-content{
    position:relative;
    z-index:1;
    background:var(--paper);
    width:100%;
    max-width:760px;
    max-height:90vh;
    overflow-y:auto;
    padding:36px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .entry-modal-close{
    position:sticky;
    top:0;
    float:right;
    margin:-10px -10px 10px 10px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-size:14px;
    line-height:1;
    cursor:pointer;
    z-index:2;
  }
  .entry-modal-close:hover{background:var(--blue);color:var(--ink);}

  @media (max-width:900px){
    .entry-modal{padding:0;}
    .entry-modal-content{max-width:100%;max-height:100vh;min-height:100vh;padding:24px;}
  }

  /* ===== GRID ===== */
  .grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:0;
  }
  .grid > * {
    border-right:1px solid var(--ink);
    border-bottom:1px solid var(--ink);
    padding:22px 24px;
    position:relative;
  }
  .grid > *:nth-child(2n){ }

  /* big blue numerals as background signature */
  .numeral{
    font-family:'Archivo Black', Arial, sans-serif;
    position:absolute;
    font-size:340px;
    line-height:1;
    color:var(--blue);
    opacity:.9;
    z-index:-1;
    user-select:none;
    pointer-events:none;
  }
  .numeral.n1{ left:-40px; bottom:-120px; }
  .numeral.n2{ right:-60px; top:40%; transform:translateY(-50%); font-size:260px;}
  .numeral.n3{ left:-30px; bottom:-140px; font-size:300px;}
  .numeral.n4{ right:-50px; bottom:-130px; font-size:300px;}
  .numeral.n5{ left:50%; bottom:-160px; transform:translateX(-50%); font-size:320px;}

  article{position:relative; z-index:1;}

  .eyebrow{
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:6px;
    display:inline-block;
    background:rgba(247,246,242,0.65);
    padding:2px 5px;
    margin-left:-5px;
    border-radius:2px;
  }
  h2.headline{
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:22px;
    line-height:1.15;
    margin:0 0 12px;
  }
  h2.headline .dot{
    color:var(--blue);
    background:rgba(247,246,242,0.65);
    padding:0 3px;
    border-radius:2px;
  }
  .byline{
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#555;
    margin-bottom:14px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--ink);
    padding:5px 0;
  }
  p{
    font-size:12.5px;
    line-height:1.72;
    margin:0 0 12px;
    text-align:justify;
    hyphens:auto;
    white-space:pre-line;
  }
  p:last-of-type{margin-bottom:0;}

  article ul, article ol,
  .entry-modal-content ul, .entry-modal-content ol{
    font-size:12.5px;
    line-height:1.72;
    margin:0 0 12px;
    padding-left:20px;
  }
  article blockquote,
  .entry-modal-content blockquote{
    margin:0 0 12px;
    padding-left:14px;
    border-left:3px solid var(--ink);
    font-style:italic;
    color:#333;
  }
  article a, .entry-modal-content a{
    color:var(--blue);
    text-decoration:underline;
    text-underline-offset:2px;
  }

  /* photo blocks: grayscale placeholder */
  .photo{
    aspect-ratio:4/3;
    width:100%;
    margin:0 0 14px;
    background:
      repeating-linear-gradient(135deg, #6b6b6b 0 2px, #7a7a7a 2px 4px),
      linear-gradient(160deg,#8a8a8a,#3a3a3a);
    filter:grayscale(1) contrast(1.05);
    transition:filter .4s ease;
    position:relative;
    overflow:hidden;
    cursor:pointer;
  }
  .photo:hover,
  .photo:active,
  .photo:focus-visible{
    filter:grayscale(0) contrast(1.05);
  }
  .photo::after{
    content:attr(data-caption);
    position:absolute;
    left:0; right:0; bottom:0;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:9px;
    letter-spacing:.04em;
    padding:5px 8px;
    font-family:Arial, sans-serif;
  }
  .photo-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:14px;
  }
  .photo-row .photo{aspect-ratio:1/1; margin-bottom:0;}

  /* ===== column spans ===== */
  .col-3{grid-column:span 3;}
  .col-4{grid-column:span 4;}
  .col-5{grid-column:span 5;}
  .col-6{grid-column:span 6;}
  .col-7{grid-column:span 7;}
  .col-8{grid-column:span 8;}
  .col-9{grid-column:span 9;}
  .col-12{grid-column:span 12; border-right:none;}

  .lede{
    background:var(--paper);
  }
  .lede h2.headline{font-size:26px;}

  /* pull quote box */
  .pull{
    border-top:3px solid var(--ink);
    border-bottom:3px solid var(--ink);
    padding:12px 0;
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:17px;
    line-height:1.3;
    margin:14px 0;
  }
  .pull span{
    color:var(--blue);
    background:rgba(247,246,242,0.65);
    padding:0 4px;
    border-radius:2px;
  }

  /* ===== footer strip ===== */
  footer{
    background:var(--ink);
    color:var(--paper);
    padding:16px 24px;
    font-size:9.5px;
    letter-spacing:.02em;
    line-height:1.9;
  }
  footer .row{
    display:flex;
    flex-wrap:wrap;
    gap:4px 0;
  }
  footer .item{
    white-space:nowrap;
  }
  footer .item::after{
    content:"  ★  ";
    color:var(--blue);
  }
  footer .item:last-child::after{content:"";}
  footer .foot-title{
    font-family:'Archivo Black', Arial, sans-serif;
    color:var(--blue);
    font-size:11px;
    letter-spacing:.06em;
    margin-bottom:8px;
    display:block;
  }

  a{color:inherit;}

  /* ===== responsive ===== */
  @media (max-width:900px){
    .grid > *{grid-column:span 12 !important; border-right:none;}
    .numeral{font-size:180px !important;}
    .masthead-title h1{font-size:44px;}
    .masthead-top, .masthead-bottom{flex-direction:column; gap:6px;}
    .masthead-top .col.right{text-align:left;}
    .right-group{flex-direction:column; align-items:flex-start; gap:10px;}
    .now-playing-slot .np-cover{width:54px;height:54px;}
    .now-playing-slot .steam-cover{width:96px;}
    .now-playing-slot .np-info{font-size:9.5px;}
    .now-playing-slot .np-label{font-size:8.5px;}
    .status-row{flex-direction:column; align-items:stretch; gap:16px;}
    .status-row .now-playing-wrap .now-playing-slot{flex-direction:row; justify-content:flex-start; text-align:left;}
  }
</style>

<!-- ================= MODAL: NOTA COMPLETA ================= -->
<div class="entry-modal" id="entry-modal">
  <div class="entry-modal-backdrop"></div>
  <div class="entry-modal-content">
    <button type="button" class="entry-modal-close" aria-label="Cerrar">✕</button>
    <div id="entry-modal-body"></div>
  </div>
</div>
  <script>
  (async function () {
    const container = document.getElementById('entradas-nuevas');
    if (!container) return;

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function photoStyle(url) {
      if (!url) return '';
      return `background-image:url('${esc(url)}');background-size:cover;background-position:center;`;
    }

    const BODY_LIMIT = 2400;
    let loadedEntries = [];

    // ---------- rich text: allow-list sanitizer for cuerpo (defense-in-depth; admin.html already sanitizes on save) ----------
    const RTE_ALLOWED = { P: [], BR: [], STRONG: [], B: [], EM: [], I: [], U: [], UL: [], OL: [], LI: [], BLOCKQUOTE: [], A: ['href', 'target', 'rel'] };
    function isSafeLinkUrl(url) {
      const u = (url || '').trim();
      return /^https?:\/\//i.test(u) || /^mailto:/i.test(u);
    }
    function sanitizeRte(html) {
      const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
      const root = doc.body.firstChild;
      (function clean(node) {
        Array.from(node.childNodes).forEach(child => {
          if (child.nodeType === Node.TEXT_NODE) return;
          if (child.nodeType !== Node.ELEMENT_NODE) { node.removeChild(child); return; }
          const tag = child.tagName;
          if (!RTE_ALLOWED[tag]) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          const href = child.getAttribute('href');
          Array.from(child.attributes).forEach(a => child.removeAttribute(a.name));
          if (tag === 'A') {
            if (isSafeLinkUrl(href)) {
              child.setAttribute('href', href.trim());
              child.setAttribute('target', '_blank');
              child.setAttribute('rel', 'noopener noreferrer nofollow');
            } else {
              while (child.firstChild) node.insertBefore(child.firstChild, child);
              node.removeChild(child);
              return;
            }
          }
          clean(child);
        });
      })(root);
      return root.innerHTML;
    }
    // A cuerpo block is either a legacy plain-text paragraph or a sanitized HTML block string (starts with "<").
    function cuerpoBlockText(p) {
      const s = (p || '').toString();
      return s.trim().startsWith('<') ? s.replace(/<[^>]+>/g, '') : s;
    }
    function renderCuerpoBlock(p) {
      const s = (p || '').toString();
      if (!s.trim()) return '';
      return s.trim().startsWith('<') ? sanitizeRte(s) : `<p>${esc(s)}</p>`;
    }

    function truncateCuerpo(cuerpo, limit) {
      let total = 0;
      const out = [];
      for (const p of cuerpo) {
        const text = cuerpoBlockText(p);
        if (!out.length || total + text.length <= limit) {
          out.push(p);
          total += text.length;
          if (total >= limit) break;
        } else {
          break;
        }
      }
      return out;
    }

    function renderPhotos(fotos, colorAlways) {
      if (!fotos || !fotos.length) return '';
      const cls = 'photo' + (colorAlways ? ' color-always' : '');
      const items = fotos.map(f => `<div class="${cls}" data-caption="${esc(f.epigrafe || '')}" style="${photoStyle(f.url)}"></div>`).join('');
      return fotos.length === 3 ? `<div class="photo-row">${items}</div>` : items;
    }

    function renderEntry(entry, idx) {
      const layout = entry.layout || 'col-6';
      const numeralClass = 'n' + ((idx % 5) + 1);
      const numeralNum = String(idx + 1).padStart(2, '0');
      const fullLength = Array.isArray(entry.cuerpo) ? entry.cuerpo.reduce((sum, p) => sum + cuerpoBlockText(p).length, 0) : 0;
      const isLong = fullLength > BODY_LIMIT;
      const cuerpoToShow = isLong ? truncateCuerpo(entry.cuerpo, BODY_LIMIT) : (entry.cuerpo || []);

      let html = `<article class="${esc(layout)}" style="min-height:380px;">`;
      html += `<span class="numeral ${numeralClass}">${numeralNum}</span>`;

      if (entry.showVolanta && entry.volanta) {
        html += `<div class="eyebrow">${esc(entry.volanta)}</div>`;
      }

      html += `<h2 class="headline">${esc(entry.titulo)}<span class="dot">.</span></h2>`;

      if (entry.showByline && entry.byline) {
        html += `<div class="byline">${esc(entry.byline)}</div>`;
      }

      if (entry.showCopete && entry.copete) {
        html += `<p style="font-weight:700;">${esc(entry.copete)}</p>`;
      }

      if (entry.showFotos) {
        html += renderPhotos(entry.fotos, false);
      }

      cuerpoToShow.forEach(p => {
        html += renderCuerpoBlock(p);
      });

      if (isLong) {
        html += `<button type="button" class="read-more-dots" data-entry-idx="${idx}" aria-label="Leer nota completa"><span class="rm-label">Leer más</span><span class="rm-dots">•••</span></button>`;
      }

      if (entry.showCita && entry.cita) {
        html += `<div class="pull">${esc(entry.cita)}</div>`;
      }

      html += '</article>';
      return html;
    }

    function renderModalContent(entry) {
      let html = '';
      if (entry.showVolanta && entry.volanta) html += `<div class="eyebrow">${esc(entry.volanta)}</div>`;
      html += `<h2 class="headline">${esc(entry.titulo)}<span class="dot">.</span></h2>`;
      if (entry.showByline && entry.byline) html += `<div class="byline">${esc(entry.byline)}</div>`;
      if (entry.showCopete && entry.copete) html += `<p style="font-weight:700;">${esc(entry.copete)}</p>`;
      if (entry.showFotos) html += renderPhotos(entry.fotos, true);
      (entry.cuerpo || []).forEach(p => {
        html += renderCuerpoBlock(p);
      });
      if (entry.showCita && entry.cita) html += `<div class="pull">${esc(entry.cita)}</div>`;
      return html;
    }

    function openEntryModal(idx) {
      const entry = loadedEntries[idx];
      if (!entry) return;
      const modal = document.getElementById('entry-modal');
      const body = document.getElementById('entry-modal-body');
      body.innerHTML = renderModalContent(entry);
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeEntryModal() {
      const modal = document.getElementById('entry-modal');
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.addEventListener('click', e => {
      const dots = e.target.closest('.read-more-dots');
      if (dots) { openEntryModal(Number(dots.dataset.entryIdx)); return; }
      if (e.target.closest('.entry-modal-close') || e.target.classList.contains('entry-modal-backdrop')) {
        closeEntryModal();
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeEntryModal();
    });

    try {
      const res = await fetch('data/entries.json', { cache: 'no-store' });
      if (!res.ok) return;
      const entries = await res.json();
      loadedEntries = entries.slice().reverse();
      loadedEntries.forEach((entry, idx) => {
        container.insertAdjacentHTML('beforeend', renderEntry(entry, idx));
      });
    } catch (err) {
      console.error('No se pudieron cargar las entradas publicadas:', err);
    }

    // ---- lo último que escuchaste ----
    function npMeta(np) {
      const isAlbum = np.tipo === 'album';
      return isAlbum
        ? `${esc(np.interprete || '')} · ${esc(np.anio || '')}`
        : `${esc(np.interprete || '')} — ${esc(np.album || '')} · ${esc(np.anio || '')}`;
    }

    function renderDropdownItem(np) {
      const img = np.imagen ? `<img src="${esc(np.imagen)}" alt="">` : '';
      return `<div class="np-dropdown-item">${img}<div class="dd-info"><span class="dd-title">${esc(np.nombre || '')}</span><span class="dd-meta">${npMeta(np)}</span></div></div>`;
    }

    function renderNowPlaying(list) {
      if (!Array.isArray(list) || !list.length || !list[0].nombre) return '';
      const current = list[0];
      const isAlbum = current.tipo === 'album';
      const label = isAlbum ? 'Álbum del momento' : 'Escuchando ahora';

      let html = '<div class="now-playing-slot">';
      if (current.imagen) html += `<img class="np-cover" src="${esc(current.imagen)}" alt="${esc(current.nombre)}">`;
      html += '<div class="np-info">';
      html += `<span class="np-label">${label}</span>`;
      html += `<span class="np-title">${esc(current.nombre)}</span>`;
      html += `<span class="np-meta">${npMeta(current)}</span>`;
      if (isAlbum && current.comentario) html += `<span class="np-comment">${esc(current.comentario)}</span>`;
      html += '</div></div>';

      html += '<div class="np-history">';
      html += '<span class="np-more" tabindex="0">Ilumíname</span>';
      html += '<div class="np-dropdown">';
      html += '<div class="np-dropdown-title">Últimas ' + list.length + ' escuchas</div>';
      html += list.map(renderDropdownItem).join('');
      html += '</div></div>';

      return html;
    }

    try {
      const npWrap = document.getElementById('now-playing-wrap');
      const npRes = await fetch('data/nowplaying.json', { cache: 'no-store' });
      if (npWrap && npRes.ok) {
        const npList = await npRes.json();
        npWrap.innerHTML = renderNowPlaying(npList);
      }
    } catch (err) {
      console.error('No se pudo cargar "lo último escuchado":', err);
    }

    // toggle del historial por tap/click, además del hover
    document.addEventListener('click', function (e) {
      const trigger = e.target.closest('.np-more');
      document.querySelectorAll('.np-history.open').forEach(el => {
        if (!el.contains(e.target)) el.classList.remove('open');
      });
      if (trigger) {
        trigger.closest('.np-history').classList.toggle('open');
      }
    });

    // ---- steam: lo último que jugué ----
    function steamMeta(g) {
      const parts = [];
      if (g.playtime2weeksMinutes) parts.push(`${(g.playtime2weeksMinutes / 60).toFixed(1)} h estas 2 semanas`);
      if (g.playtimeForeverMinutes) parts.push(`${Math.round(g.playtimeForeverMinutes / 60)} h en total`);
      return parts.join(' · ');
    }

    function renderSteamDropdownItem(g) {
      const img = g.header ? `<img class="steam-dd-cover" src="${esc(g.header)}" alt="">` : '';
      return `<div class="np-dropdown-item">${img}<div class="dd-info"><span class="dd-title">${esc(g.name || '')}</span><span class="dd-meta">${steamMeta(g)}</span></div></div>`;
    }

    function steamHoursLabel(g) {
      const minutes = g.playtimeForeverMinutes || g.playtime2weeksMinutes || 0;
      if (!minutes) return '';
      const hours = minutes / 60;
      return (hours >= 10 ? Math.round(hours) : hours.toFixed(1)) + ' h';
    }

    function renderSteamWidget(data) {
      if (!data) return '';
      const featured = data.currentlyPlaying || data.lastPlayed;
      if (!featured || !featured.name) return '';
      const label = data.currentlyPlaying ? 'Jugando ahora' : 'Última partida';
      const hours = steamHoursLabel(featured);

      let html = '<div class="now-playing-slot steam-slot">';
      if (featured.header) html += `<img class="steam-cover" src="${esc(featured.header)}" alt="${esc(featured.name)}">`;
      html += '<div class="np-info steam-info">';
      html += `<span class="np-label">${label}</span>`;
      html += '<div class="steam-title-row">';
      html += `<span class="np-title">${esc(featured.name)}</span>`;
      if (hours) html += `<span class="steam-hours">${hours}</span>`;
      html += '</div>';
      html += '</div></div>';

      const recent = Array.isArray(data.recent) ? data.recent : [];
      if (recent.length) {
        html += '<div class="np-history">';
        html += '<span class="np-more" tabindex="0">Más partidas</span>';
        html += '<div class="np-dropdown">';
        html += '<div class="np-dropdown-title">Jugado recientemente</div>';
        html += recent.map(renderSteamDropdownItem).join('');
        html += '</div></div>';
      }
      return html;
    }

    try {
      const steamWrap = document.getElementById('steam-wrap');
      const steamRes = await fetch('data/steam.json', { cache: 'no-store' });
      if (steamWrap && steamRes.ok) {
        const steamData = await steamRes.json();
        steamWrap.innerHTML = renderSteamWidget(steamData);
      }
    } catch (err) {
      console.error('No se pudo cargar el estado de Steam:', err);
    }
  })();
  </script>
</body>
</html>
