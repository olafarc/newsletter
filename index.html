<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLAF NEWS — Cuaderno personal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;900&family=Bebas+Neue&display=swap');

  :root{
    --ink:#111111;
    --paper:#f7f6f2;
    --blue:#abd615;
    --blue-dim: rgba(171,214,21,0.14);
    --rule:#111111;
    --gray-photo:#5a5a5a;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:#d8d8d2;
    color:var(--ink);
    font-family:'Archivo', Helvetica, Arial, sans-serif;
  }

  .sheet{
    max-width:1200px;
    margin:24px auto;
    background:var(--paper);
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.25);
  }

  /* ===== MASTHEAD ===== */
  .masthead{
    padding:22px 36px 14px;
    border-bottom:4px solid var(--ink);
  }
  .masthead-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    font-size:10.5px;
    line-height:1.5;
    letter-spacing:.02em;
    padding-bottom:14px;
  }
  .masthead-top .col{max-width:260px;}
  .masthead-top .col.right{text-align:right;}
  .masthead-top strong{font-weight:700;}

  .masthead-title{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding-top:10px;
  }
  .masthead-title .kicker{
    font-family:'Bebas Neue', Impact, sans-serif;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--blue);
    white-space:nowrap;
  }
  .masthead-title h1{
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:clamp(38px, 7vw, 84px);
    line-height:.9;
    margin:0;
    letter-spacing:-0.01em;
    flex:1;
  }
  .masthead-title h1 span.accent{color:var(--blue);}

  .masthead-bottom{
    display:flex;
    justify-content:space-between;
    padding-top:12px;
    font-size:10.5px;
    letter-spacing:.03em;
  }
  .masthead-bottom .tag{font-weight:700;}

  /* ===== now playing widget ===== */
  .now-playing-slot{
    display:flex;
    gap:10px;
    align-items:center;
    max-width:230px;
    text-align:left;
  }
  .now-playing-slot:empty{display:none;}
  .now-playing-slot .np-cover{
    width:54px;
    height:54px;
    flex-shrink:0;
    object-fit:cover;
    border:1px solid var(--ink);
    filter:grayscale(1) contrast(1.05);
    transition:filter .4s ease;
    cursor:pointer;
  }
  .now-playing-slot .np-cover:hover,
  .now-playing-slot .np-cover:active{
    filter:grayscale(0) contrast(1.05);
  }
  .now-playing-slot .np-info{font-size:9.5px;line-height:1.5;}
  .now-playing-slot .np-label{
    display:block;
    color:var(--blue);
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:8.5px;
    margin-bottom:2px;
  }
  .now-playing-slot .np-title{display:block;font-weight:700;}
  .now-playing-slot .np-meta{display:block;color:#555;}
  .now-playing-slot .np-comment{display:block;color:#777;font-style:italic;margin-top:2px;}

  /* ===== GRID ===== */
  .grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(12,1fr);
    gap:0;
  }
  .grid > * {
    border-right:1px solid var(--ink);
    border-bottom:1px solid var(--ink);
    padding:22px 24px;
    position:relative;
  }
  .grid > *:nth-child(2n){ }

  /* big blue numerals as background signature */
  .numeral{
    font-family:'Archivo Black', Arial, sans-serif;
    position:absolute;
    font-size:340px;
    line-height:1;
    color:var(--blue);
    opacity:.9;
    z-index:-1;
    user-select:none;
    pointer-events:none;
  }
  .numeral.n1{ left:-40px; bottom:-120px; }
  .numeral.n2{ right:-60px; top:40%; transform:translateY(-50%); font-size:260px;}
  .numeral.n3{ left:-30px; bottom:-140px; font-size:300px;}
  .numeral.n4{ right:-50px; bottom:-130px; font-size:300px;}
  .numeral.n5{ left:50%; bottom:-160px; transform:translateX(-50%); font-size:320px;}

  article{position:relative; z-index:1;}

  .eyebrow{
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--blue);
    margin-bottom:6px;
    display:inline-block;
    background:rgba(247,246,242,0.65);
    padding:2px 5px;
    margin-left:-5px;
    border-radius:2px;
  }
  h2.headline{
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:22px;
    line-height:1.15;
    margin:0 0 12px;
  }
  h2.headline .dot{
    color:var(--blue);
    background:rgba(247,246,242,0.65);
    padding:0 3px;
    border-radius:2px;
  }
  .byline{
    font-size:10px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#555;
    margin-bottom:14px;
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--ink);
    padding:5px 0;
  }
  p{
    font-size:12.5px;
    line-height:1.72;
    margin:0 0 12px;
    text-align:justify;
    hyphens:auto;
  }
  p:last-of-type{margin-bottom:0;}

  /* photo blocks: grayscale placeholder */
  .photo{
    aspect-ratio:4/3;
    width:100%;
    margin:0 0 14px;
    background:
      repeating-linear-gradient(135deg, #6b6b6b 0 2px, #7a7a7a 2px 4px),
      linear-gradient(160deg,#8a8a8a,#3a3a3a);
    filter:grayscale(1) contrast(1.05);
    position:relative;
    overflow:hidden;
  }
  .photo::after{
    content:attr(data-caption);
    position:absolute;
    left:0; right:0; bottom:0;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:9px;
    letter-spacing:.04em;
    padding:5px 8px;
    font-family:Arial, sans-serif;
  }
  .photo-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:14px;
  }
  .photo-row .photo{aspect-ratio:1/1; margin-bottom:0;}

  /* ===== column spans ===== */
  .col-3{grid-column:span 3;}
  .col-4{grid-column:span 4;}
  .col-5{grid-column:span 5;}
  .col-6{grid-column:span 6;}
  .col-7{grid-column:span 7;}
  .col-8{grid-column:span 8;}
  .col-9{grid-column:span 9;}
  .col-12{grid-column:span 12; border-right:none;}

  .lede{
    background:var(--paper);
  }
  .lede h2.headline{font-size:26px;}

  /* pull quote box */
  .pull{
    border-top:3px solid var(--ink);
    border-bottom:3px solid var(--ink);
    padding:12px 0;
    font-family:'Archivo Black', Arial, sans-serif;
    font-size:17px;
    line-height:1.3;
    margin:14px 0;
  }
  .pull span{
    color:var(--blue);
    background:rgba(247,246,242,0.65);
    padding:0 4px;
    border-radius:2px;
  }

  /* ===== footer strip ===== */
  footer{
    background:var(--ink);
    color:var(--paper);
    padding:16px 24px;
    font-size:9.5px;
    letter-spacing:.02em;
    line-height:1.9;
  }
  footer .row{
    display:flex;
    flex-wrap:wrap;
    gap:4px 0;
  }
  footer .item{
    white-space:nowrap;
  }
  footer .item::after{
    content:"  ★  ";
    color:var(--blue);
  }
  footer .item:last-child::after{content:"";}
  footer .foot-title{
    font-family:'Archivo Black', Arial, sans-serif;
    color:var(--blue);
    font-size:11px;
    letter-spacing:.06em;
    margin-bottom:8px;
    display:block;
  }

  a{color:inherit;}

  /* ===== responsive ===== */
  @media (max-width:900px){
    .grid > *{grid-column:span 12 !important; border-right:none;}
    .numeral{font-size:180px !important;}
    .masthead-title h1{font-size:44px;}
    .masthead-top, .masthead-bottom{flex-direction:column; gap:6px;}
    .masthead-top .col.right{text-align:left;}
  }
</style>
</head>
<body>

<div class="sheet">

  <!-- ================= MASTHEAD ================= -->
  <div class="masthead">
    <div class="masthead-top">
      <div class="col">
        <strong>Escribe:</strong> Olaf<br>
        <strong>Frecuencia:</strong> cuando hay algo para contar
      </div>
      <div class="col right">
        <strong>Primer número</strong><br>
        Uso personal — no es un producto
      </div>
      <div class="col now-playing-slot" id="now-playing"></div>
    </div>

    <div class="masthead-title">
      <span class="kicker">Cuaderno personal ·</span>
      <h1>OLAF<span class="accent">NEWS</span></h1>
    </div>

    <div class="masthead-bottom">
      <span>Apuntes, procesos e ideas sueltas</span>
      <span class="tag">Nº 01</span>
    </div>
  </div>

  <!-- ================= ENTRADAS PUBLICADAS DESDE EL PANEL ================= -->
  <div class="grid" id="entradas-nuevas"></div>

  <!-- ================= FOOTER ================= -->
  <footer>
    <span class="foot-title">Notas al pie</span>
    <div class="row">
      <span class="item">Cuaderno personal — sin fines comerciales</span>
      <span class="item">Próximo número: cuando haya algo para contar</span>
    </div>
  </footer>

</div>

  <!-- ============ CARGA DE ENTRADAS PUBLICADAS DESDE data/entries.json ============ -->
  <script>
  (async function () {
    const container = document.getElementById('entradas-nuevas');
    if (!container) return;

    function esc(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function photoStyle(url) {
      if (!url) return '';
      return `background-image:url('${esc(url)}');background-size:cover;background-position:center;`;
    }

    function renderEntry(entry, idx) {
      const layout = entry.layout || 'col-6';
      const numeralClass = 'n' + ((idx % 5) + 1);
      const numeralNum = String(idx + 1).padStart(2, '0');

      let html = `<article class="${esc(layout)}" style="min-height:380px;">`;
      html += `<span class="numeral ${numeralClass}">${numeralNum}</span>`;

      if (entry.showVolanta && entry.volanta) {
        html += `<div class="eyebrow">${esc(entry.volanta)}</div>`;
      }

      html += `<h2 class="headline">${esc(entry.titulo)}<span class="dot">.</span></h2>`;

      if (entry.showByline && entry.byline) {
        html += `<div class="byline">${esc(entry.byline)}</div>`;
      }

      if (entry.showCopete && entry.copete) {
        html += `<p style="font-weight:700;">${esc(entry.copete)}</p>`;
      }

      if (entry.showFotos && Array.isArray(entry.fotos) && entry.fotos.length) {
        if (entry.fotos.length === 3) {
          html += '<div class="photo-row">';
          entry.fotos.forEach(f => {
            html += `<div class="photo" data-caption="${esc(f.epigrafe || '')}" style="${photoStyle(f.url)}"></div>`;
          });
          html += '</div>';
        } else {
          entry.fotos.forEach(f => {
            html += `<div class="photo" data-caption="${esc(f.epigrafe || '')}" style="${photoStyle(f.url)}"></div>`;
          });
        }
      }

      if (Array.isArray(entry.cuerpo)) {
        entry.cuerpo.forEach(p => {
          if (p && p.trim()) html += `<p>${esc(p)}</p>`;
        });
      }

      if (entry.showCita && entry.cita) {
        html += `<div class="pull">${esc(entry.cita)}</div>`;
      }

      html += '</article>';
      return html;
    }

    try {
      const res = await fetch('data/entries.json', { cache: 'no-store' });
      if (!res.ok) return;
      const entries = await res.json();
      entries.forEach((entry, idx) => {
        container.insertAdjacentHTML('beforeend', renderEntry(entry, idx));
      });
    } catch (err) {
      console.error('No se pudieron cargar las entradas publicadas:', err);
    }

    // ---- lo último que escuchaste ----
    function renderNowPlaying(np) {
      if (!np || !np.nombre) return '';
      const isAlbum = np.tipo === 'album';
      const label = isAlbum ? 'Álbum del momento' : 'Escuchando ahora';
      const meta = isAlbum
        ? `${esc(np.interprete || '')} · ${esc(np.anio || '')}`
        : `${esc(np.interprete || '')} — ${esc(np.album || '')} · ${esc(np.anio || '')}`;
      let html = '';
      if (np.imagen) html += `<img class="np-cover" src="${esc(np.imagen)}" alt="${esc(np.nombre)}">`;
      html += '<div class="np-info">';
      html += `<span class="np-label">${label}</span>`;
      html += `<span class="np-title">${esc(np.nombre)}</span>`;
      html += `<span class="np-meta">${meta}</span>`;
      if (isAlbum && np.comentario) html += `<span class="np-comment">${esc(np.comentario)}</span>`;
      html += '</div>';
      return html;
    }

    try {
      const npEl = document.getElementById('now-playing');
      const npRes = await fetch('data/nowplaying.json', { cache: 'no-store' });
      if (npEl && npRes.ok) {
        const np = await npRes.json();
        npEl.innerHTML = renderNowPlaying(np);
      }
    } catch (err) {
      console.error('No se pudo cargar "lo último escuchado":', err);
    }
  })();
  </script>
</body>
</html>
